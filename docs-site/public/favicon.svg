<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <!-- Grove's default (light theme) app launcher icon: the five-spoke org
         asterisk mark (accent #8A5A2B) on the accent-soft #EDE5D9 tile. Fixed
         to the light palette on purpose - it mirrors the launcher icon, which
         does not follow the browser colour scheme. -->
    <rect width="128" height="128" rx="28" fill="#EDE5D9"/>
    <g fill="#8A5A2B">
        <rect x="56.5" y="64" width="15" height="34" rx="7.5" transform="rotate(36 64 64)"/>
        <rect x="56.5" y="64" width="15" height="34" rx="7.5" transform="rotate(108 64 64)"/>
        <rect x="56.5" y="64" width="15" height="34" rx="7.5" transform="rotate(180 64 64)"/>
        <rect x="56.5" y="64" width="15" height="34" rx="7.5" transform="rotate(252 64 64)"/>
        <rect x="56.5" y="64" width="15" height="34" rx="7.5" transform="rotate(324 64 64)"/>
    </g>
</svg>
