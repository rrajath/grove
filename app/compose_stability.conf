// Compose compiler stability configuration.
//
// These types are deeply immutable (all `val`, value semantics, only ever
// rebuilt via copy) but the Compose compiler can't prove it because they hold
// List/Set fields or java.time values. Declaring them stable here lets the
// composables that read the UI state classes carrying them skip recomposition
// when the state is unchanged. See internal/PERFORMANCE_AUDIT_2026-08-27.md #6.

java.time.LocalDate
java.time.LocalTime
java.time.LocalDateTime

com.rrajath.grove.org.OrgKeywords
com.rrajath.grove.org.OrgTimestamp
com.rrajath.grove.org.ArchiveTarget

// Sync progress/result values: built once per sync step and never mutated,
// but SyncResult carries List/Map fields. Carried inside NotebooksUiState.
com.rrajath.grove.sync.SyncState
com.rrajath.grove.sync.SyncResult
