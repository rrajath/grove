name: Build & Release

# Build debug and release APKs on every push (and PR); this is CI validation
# only, so nothing gets tagged or published from a push. A GitHub Release
# (tag + both APKs + the AAB) is cut only from a manual "Run workflow"
# dispatch against the default branch, so several pushes with unrelated
# fixes can land before you choose to cut and distribute a release.
# docs-site/ is excluded: it's a separate Astro/Starlight site deployed via
# Cloudflare Pages (which has its own build watch path on docs-site/**), so an
# app CI run here would be redundant for docs-only changes.
on:
  push:
    paths-ignore:
      - 'docs-site/**'
  pull_request:
    paths-ignore:
      - 'docs-site/**'
  workflow_dispatch:

# contents: write is needed to create the release and its tag.
permissions:
  contents: write

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # versionCode = git commit count, so the full history must be present.
      # Signing only kicks in once the keystore secret is configured AND the
      # alias/passwords are valid; otherwise the release build stays unsigned
      # (build.gradle.kts validates and degrades gracefully) and CI stays green.
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Computed once here and reused for the GitHub Release tag/title below.
      # VERSION_CODE is also stamped into the archived CHANGELOG.md header (see
      # the Archive step) since VERSION (versionName) is manually bumped and can
      # repeat across releases; VERSION_CODE stays the one value the What's New
      # modal can rely on for ordering.
      - name: Compute version
        run: |
          set -euo pipefail
          VERSION="$(./gradlew -q printVersionName | tail -n1)"
          VERSION_CODE="$(./gradlew -q printVersionCode | tail -n1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      # bundleRelease produces the .aab Play Console requires for submission
      # (Play no longer accepts a bare APK for new apps); the two assembleX
      # tasks keep producing the APKs used for GitHub Releases and sideloading.
      - name: Build debug and release APKs, and release AAB
        env:
          # Empty when no keystore secret is set → build.gradle.kts leaves the
          # release build unsigned.
          SIGNING_KEYSTORE_PATH: ${{ env.HAS_SIGNING == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Releases are manual-only: dispatching this workflow from any other ref
      # just builds and tests, same as a push does, with no release step.
      - name: Warn if dispatched off the default branch
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: echo "::warning::Manually run from '${{ github.ref_name }}', not the default branch. Building and testing only, no release will be published."

      # Nothing to release if nobody added anything under Unreleased since the
      # last cut, that's the signal for "this run doesn't need a release,"
      # not the mere act of dispatching the workflow. Pulls the section
      # content (not the header) into GITHUB_ENV via the multiline heredoc
      # form so later steps can reuse it verbatim as release notes.
      - name: Read Unreleased section from CHANGELOG.md
        if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          NOTES="$(awk '
            /^## \[Unreleased\]$/ { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | awk 'NF{p=1} p')"
          if [ -z "$NOTES" ]; then
            echo "HAS_RELEASE=false" >> "$GITHUB_ENV"
            echo "No content under '## [Unreleased]' in CHANGELOG.md — skipping release for this push."
          else
            echo "HAS_RELEASE=true" >> "$GITHUB_ENV"
            {
              echo "RELEASE_NOTES<<CHANGELOG_EOF"
              echo "$NOTES"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_ENV"
          fi

      # Publish a GitHub Release with both APKs, but only when there was
      # something under Unreleased to publish. The tag is "v$VERSION-$VERSION_CODE"
      # rather than just "v$VERSION": VERSION (versionName) is now manually bumped
      # and commonly repeats across many pushes, so a tag keyed on VERSION alone
      # would collide with the previous release's tag and this step would just
      # silently clobber that release's assets instead of publishing a new one —
      # which is exactly what happened to every release between 1.0.0 and this
      # fix, and is why Obtainium (and anyone else watching Releases) stopped
      # seeing updates. VERSION_CODE (git commit count) is unique per commit, so
      # appending it guarantees a fresh tag, and therefore a genuinely new
      # release, on every release-worthy push. The dash keeps it visually and
      # semantically distinct from the pre-1.0.0 "v1.0.<N>" auto-versioning tags
      # (see CHANGELOG.md's "Versioning" section) so it doesn't read as a
      # reversion to that scheme. The release title is kept human-friendly and
      # separate from the tag string. Re-runs of the *same* commit recompute the
      # same VERSION_CODE and therefore the same tag, so they still safely
      # re-upload assets instead of failing on an existing tag.
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && env.HAS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION-$VERSION_CODE"
          TITLE="v$VERSION (build $VERSION_CODE)"
          NOTES="$(printf '%s\n\n_Commit: %s_' "$RELEASE_NOTES" "${GITHUB_SHA:0:7}")"
          # The release APK is app-release.apk when signed, app-release-unsigned.apk otherwise.
          # The AAB is attached too so a signed one is available to upload to Play Console
          # without a separate local build.
          ASSETS=$(ls app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      # Moves what was just released out of Unreleased and into its own
      # "## [$VERSION] - <date>" heading, then pushes that as a follow-up
      # commit — this is the step that removes the manual
      # `./gradlew -q printVersionName` + hand-editing CHANGELOG.md
      # previously required before every release-worthy push. [skip ci] stops
      # this bot commit from triggering (and re-releasing on) itself.
      - name: Archive released version in CHANGELOG.md
        if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && env.HAS_RELEASE == 'true'
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          awk -v ver="$VERSION" -v date="$DATE" -v code="$VERSION_CODE" '
            /^## \[Unreleased\]$/ && !done {
              print
              print ""
              print "## [" ver "] - " date " (build " code ")"
              done=1
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: cut CHANGELOG.md entry for $VERSION [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
