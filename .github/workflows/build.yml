name: Build & Release

# What runs depends on the trigger, cheapest first:
#   - Any push (any branch) or PR: unit tests + assembleDebug only. This is
#     the regression net; the expensive release/bundle/R8 work is skipped.
#     The debug APK is still uploaded as a CI artifact for sideload testing.
#   - Push to the default branch: the above PLUS assembleRelease (no bundle,
#     no publish). R8/ProGuard and signing-config breakage is caught here, at
#     merge time, instead of only when a release is cut.
#   - Push a version tag matching v*.*.* (e.g. `git tag v1.2.0 && git push
#     origin v1.2.0`), or a manual "Run workflow" dispatch against the default
#     branch: the full path — assembleRelease + bundleRelease + publish a
#     GitHub Release (tag + both APKs + the AAB).
# So several pushes with unrelated fixes can land before you choose to cut and
# distribute a release. `branches: ['**']` is listed alongside `tags` below
# because specifying only `tags` would stop plain branch pushes from
# triggering this workflow at all.
# docs-site/ is excluded: it's a separate Astro/Starlight site deployed via
# Cloudflare Pages (which has its own build watch path on docs-site/**), so an
# app CI run here would be redundant for docs-only changes. paths-ignore has
# no effect on tag pushes (GitHub doesn't evaluate path filters for tags), so
# a version tag always triggers regardless of what it touches.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'docs-site/**'
  pull_request:
    paths-ignore:
      - 'docs-site/**'
  workflow_dispatch:

# contents: write is needed to create the release and its tag.
permissions:
  contents: write

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # versionCode = git commit count, so the full history must be present.
      # Signing only kicks in once the keystore secret is configured AND the
      # alias/passwords are valid; otherwise the release build stays unsigned
      # (build.gradle.kts validates and degrades gracefully) and CI stays green.
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Computed once here and reused for the GitHub Release tag/title below.
      # VERSION_CODE is also stamped into the archived CHANGELOG.md header (see
      # the Archive step) since VERSION (versionName) is manually bumped and can
      # repeat across releases; VERSION_CODE stays the one value the What's New
      # modal can rely on for ordering.
      #
      # Two ways to reach this workflow with release intent, and each picks its
      # own release tag / changelog version:
      #   - A pushed tag (refs/tags/v*.*.*): RELEASE_TAG is exactly the tag you
      #     pushed, and CHANGELOG_VERSION is that tag with its leading "v"
      #     stripped — so the git tag, the GitHub Release, and the CHANGELOG.md
      #     heading always agree, regardless of whether gradle.properties'
      #     versionName was bumped to match. Bump it anyway before tagging, so
      #     the app's own About/What's New screens stay in sync.
      #   - workflow_dispatch on the default branch: unchanged from before —
      #     RELEASE_TAG is v$VERSION-$VERSION_CODE (versionName + commit count),
      #     which is what guarantees uniqueness when nobody hand-tagged anything.
      - name: Compute version
        run: |
          set -euo pipefail
          VERSION="$(./gradlew -q printVersionName | tail -n1)"
          VERSION_CODE="$(./gradlew -q printVersionCode | tail -n1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          # Local shell vars first, then written to GITHUB_ENV once at the end:
          # GITHUB_ENV writes only take effect for *later* steps, so the
          # SHOULD_RELEASE check below can't read IS_TAG_RELEASE back out of it
          # within this same step.
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            IS_TAG_RELEASE=true
            RELEASE_TAG="$TAG_NAME"
            CHANGELOG_VERSION="${TAG_NAME#v}"
          else
            IS_TAG_RELEASE=false
            RELEASE_TAG="v$VERSION-$VERSION_CODE"
            CHANGELOG_VERSION="$VERSION"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            SHOULD_RELEASE=true
          elif [ "$IS_TAG_RELEASE" = "true" ]; then
            SHOULD_RELEASE=true
          else
            SHOULD_RELEASE=false
          fi
          # assembleRelease (R8 + signing config) also runs on a plain push to
          # the default branch, even though nothing is published then — it's
          # the cheapest place to catch release-only breakage before a tag is
          # cut. bundleRelease and the publish stay gated on SHOULD_RELEASE.
          if [ "$SHOULD_RELEASE" = "true" ]; then
            BUILD_RELEASE=true
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            BUILD_RELEASE=true
          else
            BUILD_RELEASE=false
          fi
          echo "IS_TAG_RELEASE=$IS_TAG_RELEASE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "CHANGELOG_VERSION=$CHANGELOG_VERSION" >> "$GITHUB_ENV"
          echo "SHOULD_RELEASE=$SHOULD_RELEASE" >> "$GITHUB_ENV"
          echo "BUILD_RELEASE=$BUILD_RELEASE" >> "$GITHUB_ENV"

      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true' && env.BUILD_RELEASE == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      # Always built: the regression net, and the artifact used for sideload
      # testing a branch.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # assembleRelease runs R8 / resource shrinking against the ProGuard keep
      # rules and exercises the signing config — the release-only failure modes
      # (e.g. R8 dropping a reflectively-constructed class). BUILD_RELEASE is
      # true on any push to the default branch, so this is caught at merge
      # time, not only when a release tag is pushed.
      - name: Build release APK
        if: env.BUILD_RELEASE == 'true'
        env:
          # Empty when no keystore secret is set → build.gradle.kts leaves the
          # release build unsigned.
          SIGNING_KEYSTORE_PATH: ${{ env.HAS_SIGNING == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # bundleRelease produces the .aab Play Console requires for submission
      # (Play no longer accepts a bare APK for new apps). Only needed on the
      # release path, so it's gated on SHOULD_RELEASE rather than BUILD_RELEASE.
      - name: Build release AAB
        if: env.SHOULD_RELEASE == 'true'
        env:
          SIGNING_KEYSTORE_PATH: ${{ env.HAS_SIGNING == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        if: env.SHOULD_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Releases are manual-only: dispatching this workflow from any other ref
      # just builds and tests, same as a push does, with no release step.
      - name: Warn if dispatched off the default branch
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: echo "::warning::Manually run from '${{ github.ref_name }}', not the default branch. Building and testing only, no release will be published."

      # Nothing to release if nobody added anything under Unreleased since the
      # last cut, that's the signal for "this run doesn't need a release,"
      # not the mere act of dispatching the workflow. Pulls the section
      # content (not the header) into GITHUB_ENV via the multiline heredoc
      # form so later steps can reuse it verbatim as release notes.
      #
      # A pushed release tag skips the emptiness gate: pushing v1.2.0 is
      # already an explicit "release this now," so an empty Unreleased
      # section just means "no changelog notes," not "skip the release."
      - name: Read Unreleased section from CHANGELOG.md
        if: env.SHOULD_RELEASE == 'true'
        run: |
          set -euo pipefail
          NOTES="$(awk '
            /^## \[Unreleased\]$/ { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | awk 'NF{p=1} p')"
          if [ -z "$NOTES" ] && [ "$IS_TAG_RELEASE" != "true" ]; then
            echo "HAS_RELEASE=false" >> "$GITHUB_ENV"
            echo "No content under '## [Unreleased]' in CHANGELOG.md — skipping release for this push."
          else
            echo "HAS_RELEASE=true" >> "$GITHUB_ENV"
            if [ -z "$NOTES" ]; then
              NOTES="(no changelog entry)"
            fi
            {
              echo "RELEASE_NOTES<<CHANGELOG_EOF"
              echo "$NOTES"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_ENV"
          fi

      # Publish a GitHub Release with both APKs, but only when there was
      # something under Unreleased to publish (or a release tag was pushed —
      # see the Read Unreleased step above). The dispatch-triggered tag is
      # "v$VERSION-$VERSION_CODE" rather than just "v$VERSION": VERSION
      # (versionName) is manually bumped and commonly repeats across many
      # pushes, so a tag keyed on VERSION alone would collide with the
      # previous release's tag and this step would just silently clobber that
      # release's assets instead of publishing a new one — which is exactly
      # what happened to every release between 1.0.0 and this fix, and is why
      # Obtainium (and anyone else watching Releases) stopped seeing updates.
      # VERSION_CODE (git commit count) is unique per commit, so appending it
      # guarantees a fresh tag, and therefore a genuinely new release, on
      # every release-worthy dispatch. A pushed release tag doesn't need any
      # of that: RELEASE_TAG is just the tag you pushed, since you're the one
      # guaranteeing its uniqueness by choosing not to reuse it. The dash in
      # the dispatch-computed tag keeps it visually and semantically distinct
      # from the pre-1.0.0 "v1.0.<N>" auto-versioning tags (see CHANGELOG.md's
      # "Versioning" section) so it doesn't read as a reversion to that
      # scheme. Re-runs of the *same* commit/tag recompute the same
      # RELEASE_TAG, so they still safely re-upload assets instead of failing
      # on an existing tag.
      - name: Publish GitHub Release
        if: env.SHOULD_RELEASE == 'true' && env.HAS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [ "$IS_TAG_RELEASE" = "true" ]; then
            TITLE="$RELEASE_TAG (build $VERSION_CODE)"
          else
            TITLE="v$VERSION (build $VERSION_CODE)"
          fi
          NOTES="$(printf '%s\n\n_Commit: %s_' "$RELEASE_NOTES" "${GITHUB_SHA:0:7}")"
          # The release APK is app-release.apk when signed, app-release-unsigned.apk otherwise.
          # The AAB is attached too so a signed one is available to upload to Play Console
          # without a separate local build.
          ASSETS=$(ls app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      # Moves what was just released out of Unreleased and into its own
      # "## [$CHANGELOG_VERSION] - <date>" heading, then pushes that as a
      # follow-up commit — this is the step that removes the manual
      # `./gradlew -q printVersionName` + hand-editing CHANGELOG.md
      # previously required before every release-worthy push. [skip ci] stops
      # this bot commit from triggering (and re-releasing on) itself.
      #
      # A pushed release tag can point anywhere, not just at the default
      # branch's tip — `git push origin HEAD:<default>` would silently rewind
      # that branch to whatever the tag's commit was if we ran it
      # unconditionally. So for a tag release this step first confirms the
      # tag's commit *is* the default branch's current tip (via a plain
      # ls-remote, since checkout doesn't necessarily leave a local
      # origin/<default> ref lying around for a tag-triggered run) and skips
      # the commit+push with a warning otherwise. workflow_dispatch already
      # required running on that tip via its own condition above, so it never
      # needs this check.
      - name: Archive released version in CHANGELOG.md
        if: env.SHOULD_RELEASE == 'true' && env.HAS_RELEASE == 'true'
        run: |
          set -euo pipefail
          if [ "$IS_TAG_RELEASE" = "true" ]; then
            DEFAULT_SHA="$(git ls-remote origin "refs/heads/${{ github.event.repository.default_branch }}" | cut -f1)"
            if [ "$DEFAULT_SHA" != "$GITHUB_SHA" ]; then
              echo "::warning::$RELEASE_TAG does not point at the tip of ${{ github.event.repository.default_branch }} ($DEFAULT_SHA) — skipping the CHANGELOG.md archive commit so this doesn't rewrite that branch. Archive it by hand if needed."
              exit 0
            fi
          fi
          DATE="$(date -u +%Y-%m-%d)"
          awk -v ver="$CHANGELOG_VERSION" -v date="$DATE" -v code="$VERSION_CODE" '
            /^## \[Unreleased\]$/ && !done {
              print
              print ""
              print "## [" ver "] - " date " (build " code ")"
              done=1
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: cut CHANGELOG.md entry for $CHANGELOG_VERSION [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
