# Journey 11: create a new note above, below, and as a child of an existing
# note, via the outline's left-swipe panel (Above / Below / Sub / Refile).
#
# Each action inserts a blank heading immediately (no position dialog) and
# opens it straight in the editor with the cursor already on the title line,
# so the flow just types a marker and saves. Reference note: "Tag the
# release" (projects.org, a leaf TODO with no children of its own).
#
# ASSUMPTION -- carried over from flow 04's pattern: `inputText` after tapping
# `edit_note_field` appends right after the pre-filled "* " (this assumes the
# default "New note cursor: Heading" setting, so the cursor already sits at
# end-of-title). Flag for on-device verification.
#
# SCOPE: this only asserts each marker becomes visible in the outline, not its
# exact position/nesting relative to "Tag the release" -- Maestro has no
# built-in "element A is above/below/indented-under element B" assertion.
# Confirm ordering/nesting visually on the first on-device run.
#
# UNVERIFIED ON-DEVICE -- the element-anchored `swipe` step is confirmed
# working (see flow 08).
#
# Fixed 2026-09-15: a freshly opened outline starts fully collapsed, so
# "Tag the release" (nested under "Ship v2 release") needs that parent
# expanded first.
appId: com.rrajath.grove.debug
tags:
  - e2e
---
- runFlow: ../subflows/launch-seeded.yaml
- runFlow: ../subflows/open-outline-projects.yaml

# A freshly opened outline starts fully collapsed, and "Tag the release" is
# nested under the top-level "Ship v2 release", so expand that first (index
# 0, the first foldable top-level heading). It stays expanded for the rest of
# this flow since the same outline instance persists across each edit round trip.
- extendedWaitUntil:
    visible:
      text: "Ship v2 release"
    timeout: 10000
- tapOn:
    id: "outline_toggle"
    index: 0

# Above.
- extendedWaitUntil:
    visible:
      text: "Tag the release"
    timeout: 10000
- swipe:
    direction: LEFT
    from:
      text: "Tag the release"
- tapOn:
    text: "Above"
- extendedWaitUntil:
    visible:
      id: "edit_note_field"
    timeout: 10000
- tapOn:
    id: "edit_note_field"
- inputText: "MAESTRO-ABOVE-MARKER"
- hideKeyboard
- tapOn:
    id: "edit_note_save"
- back
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "outline_list"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "MAESTRO-ABOVE-MARKER"
    timeout: 10000

# Below.
- swipe:
    direction: LEFT
    from:
      text: "Tag the release"
- tapOn:
    text: "Below"
- extendedWaitUntil:
    visible:
      id: "edit_note_field"
    timeout: 10000
- tapOn:
    id: "edit_note_field"
- inputText: "MAESTRO-BELOW-MARKER"
- hideKeyboard
- tapOn:
    id: "edit_note_save"
- back
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "outline_list"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "MAESTRO-BELOW-MARKER"
    timeout: 10000

# As a child ("Sub").
- swipe:
    direction: LEFT
    from:
      text: "Tag the release"
- tapOn:
    text: "Sub"
- extendedWaitUntil:
    visible:
      id: "edit_note_field"
    timeout: 10000
- tapOn:
    id: "edit_note_field"
- inputText: "MAESTRO-CHILD-MARKER"
- hideKeyboard
- tapOn:
    id: "edit_note_save"
- back
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "outline_list"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "MAESTRO-CHILD-MARKER"
    timeout: 10000
