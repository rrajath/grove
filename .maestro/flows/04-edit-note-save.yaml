# Journey 4: edit a note and confirm the change persisted.
#
# Seeded vault -> open a note via Search -> Edit -> append a marker -> Save ->
# leave the screen -> reopen the note -> the marker is still there.
#
# No relaunch between edit and re-open: clearState would re-seed the vault and
# wipe the edit. Persistence here means "written to the file, survives leaving
# and re-entering the note".
appId: com.rrajath.grove.debug
tags:
  - e2e
---
- runFlow: ../subflows/launch-seeded.yaml
- runFlow: ../subflows/open-search.yaml
- runFlow: ../subflows/search-open-photosynthesis.yaml

# Read -> Edit via the top-bar toggle.
- tapOn:
    text: "Edit"
- extendedWaitUntil:
    visible:
      id: "edit_note_field"
    timeout: 10000
- tapOn:
    id: "edit_note_field"
- inputText: " EDITED-BY-MAESTRO"
- hideKeyboard
- tapOn:
    id: "edit_note_save"

# Save keeps you in the editor. One `back` returns to the Search screen with the
# "photosynthesis" query and its result still in place (that screen re-focuses
# the field, so drop the IME before tapping the row). Re-opening the row is the
# "leave and re-enter" that proves the marker was written to the file, not just
# held in the editor's buffer.
- back
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "search_result_row"
    timeout: 10000
- tapOn:
    id: "search_result_row"
    index: 0
- extendedWaitUntil:
    visible:
      id: "read_note_screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: ".*EDITED-BY-MAESTRO.*"
    timeout: 10000
