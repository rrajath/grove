# Journey 9: favorite and unfavorite a note, from both entry points.
#
# Part A -- Outline right-swipe panel (State / Schedule / Note / Fav):
#   "Write the store listing" -> Fav -> toast -> swipe again, the panel now
#   reads "Unfav" -> Unfav -> toast.
# Part B -- Read mode's metadata bottom sheet:
#   open "Backlog" in Read mode -> the "☰" menu -> "★ Favorite" -> the sheet's
#   own label flips in place to "★ Favorited" -> tap again to unfavorite, label
#   flips back.
#
# UNVERIFIED ON-DEVICE -- the element-anchored `swipe` step is confirmed
# working (see flow 08).
#
# Fixed 2026-09-15: a freshly opened outline starts fully collapsed, so
# "Write the store listing" (nested under "Ship v2 release") needs that
# parent expanded first.
appId: com.rrajath.grove.debug
tags:
  - e2e
---
- runFlow: ../subflows/launch-seeded.yaml
- runFlow: ../subflows/open-outline-projects.yaml

# Part A: swipe-reveal favorite / unfavorite. A freshly opened outline starts
# fully collapsed, and "Write the store listing" is nested under the
# top-level "Ship v2 release", so expand that first (index 0, the first
# foldable top-level heading).
- extendedWaitUntil:
    visible:
      text: "Ship v2 release"
    timeout: 10000
- tapOn:
    id: "outline_toggle"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Write the store listing"
    timeout: 10000
- swipe:
    direction: RIGHT
    from:
      text: "Write the store listing"
- tapOn:
    text: "Fav"
- extendedWaitUntil:
    visible:
      text: "★ Added to favorites"
    timeout: 5000

- swipe:
    direction: RIGHT
    from:
      text: "Write the store listing"
- extendedWaitUntil:
    visible:
      text: "Unfav"
    timeout: 5000
- tapOn:
    text: "Unfav"
- extendedWaitUntil:
    visible:
      text: "Removed favorite"
    timeout: 5000

# Part B: the metadata bottom sheet's own Favorite toggle, in Read mode.
- tapOn:
    text: "Backlog"
- extendedWaitUntil:
    visible:
      id: "read_note_screen"
    timeout: 10000
- tapOn:
    text: "☰"
- extendedWaitUntil:
    visible:
      text: "★ Favorite"
    timeout: 5000
- tapOn:
    text: "★ Favorite"
- extendedWaitUntil:
    visible:
      text: "★ Unfavorite"
    timeout: 5000
- tapOn:
    text: "★ Unfavorite"
- extendedWaitUntil:
    visible:
      text: "★ Favorite"
    timeout: 5000
