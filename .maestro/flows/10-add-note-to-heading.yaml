# Journey 10: log a free-text note against a heading (a LOGBOOK entry), from
# both entry points.
#
# Part A -- Outline right-swipe panel: "Tag the release" -> Note -> type ->
#   Add -> toast.
# Part B -- Read mode's metadata bottom sheet: "Backlog" -> "☰" -> "+ Add
#   note" -> type -> Add -> expand :LOGBOOK: -> note text. Same dialog (NoteDialog), same
#   DocumentViewModel.addNote() under both entry points.
#
# UNVERIFIED ON-DEVICE -- the element-anchored `swipe` step is confirmed
# working (see flow 08).
#
# Fixed 2026-09-15: a freshly opened outline starts fully collapsed, so
# "Tag the release" (nested under "Ship v2 release") needs that parent
# expanded first.
appId: com.rrajath.grove.debug
tags:
  - e2e
---
- runFlow: ../subflows/launch-seeded.yaml
- runFlow: ../subflows/open-outline-projects.yaml

# A freshly opened outline starts fully collapsed, and "Tag the release" is
# nested under the top-level "Ship v2 release", so expand that first (index
# 0, the first foldable top-level heading).
- extendedWaitUntil:
    visible:
      text: "Ship v2 release"
    timeout: 10000
- tapOn:
    id: "outline_toggle"
    index: 0

# Part A: swipe-reveal "Note".
- extendedWaitUntil:
    visible:
      text: "Tag the release"
    timeout: 10000
- swipe:
    direction: RIGHT
    from:
      text: "Tag the release"
- tapOn:
    text: "Note"
- extendedWaitUntil:
    visible:
      text: "Add note"
    timeout: 5000
- tapOn:
    text: "Note contents"
- inputText: "MAESTRO-SWIPE-LOGBOOK-NOTE"
- hideKeyboard
- tapOn:
    text: "Add"
- extendedWaitUntil:
    visible:
      text: "Note added"
    timeout: 5000
- tapOn:
    text: "Tag the release"
- extendedWaitUntil:
    visible:
      text: ":LOGBOOK:"
    timeout: 5000
- tapOn:
    text: ":LOGBOOK:"
- extendedWaitUntil:
    visible:
      text: "MAESTRO-SWIPE-LOGBOOK-NOTE"
    timeout: 5000
- back    

# Part B: metadata sheet's "+ Add note".
- tapOn:
    text: "Backlog"
- extendedWaitUntil:
    visible:
      id: "read_note_screen"
    timeout: 10000
- tapOn:
    text: "☰"
- extendedWaitUntil:
    visible:
      text: "+ Add note"
    timeout: 5000
- tapOn:
    text: "+ Add note"
- extendedWaitUntil:
    visible:
      text: "Add note"
    timeout: 5000
- tapOn:
    text: "Note contents"
- inputText: "MAESTRO-METADATA-LOGBOOK-NOTE"
- hideKeyboard
# - back
- tapOn:
    text: "Add"

# Add closes only the note dialog; dismiss the metadata sheet too, then expand
# Backlog's (collapsed) :LOGBOOK: drawer and check the note's own line. The
# drawer renders each logbook line trimmed as its own Text, so the note body
# matches exactly.
- back
- extendedWaitUntil:
    visible:
      text: ":LOGBOOK:"
    timeout: 5000
- tapOn:
    text: ":LOGBOOK:"
- extendedWaitUntil:
    visible:
      text: "MAESTRO-METADATA-LOGBOOK-NOTE"
    timeout: 5000
