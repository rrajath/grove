# Journey 2: capture a note through a template and confirm it persisted.
#
# Seeded vault -> dock "+ Capture" -> pick the "Quick Note" template (appends
# "* <text>" to the bottom of inbox.org) -> type a heading -> Save -> the editor
# closes -> the new heading is findable in Search.
appId: com.rrajath.grove.debug
tags:
  - e2e
---
- runFlow: ../subflows/launch-seeded.yaml

- tapOn:
    id: "notebooks_capture"
# With >1 template the picker sheet shows; "Quick Note" is the simplest target
# (no datetree, no %^{prompt}). A single-template vault would skip straight to
# the editor, so the tap is optional.
- tapOn:
    text: "Quick Note"
    optional: true
- assertVisible:
    id: "capture_body_field"
    timeout: 10000
# A fixed string is fine: every run starts from a freshly re-seeded vault
# (clearState + grove_test_seed), so nothing from a prior run lingers.
- tapOn:
    id: "capture_body_field"
- inputText: "Maestro capture note"
- tapOn:
    id: "capture_save"

# Editor dismisses on save.
- assertNotVisible:
    id: "capture_body_field"

# The captured heading is now in the index.
- runFlow: ../subflows/open-search.yaml
- tapOn:
    id: "search_field"
- inputText: "Maestro capture"
- assertVisible:
    text: ".*Maestro capture.*"
    timeout: 15000
