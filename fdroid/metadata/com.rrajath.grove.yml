AutoName: Grove
Summary: Native Org-mode notes, synced the way you already trust
Description: |-
  Grove is a native Android Org-mode note-taking app: a first-class mobile
  companion for Emacs org-mode users. It edits plain .org files in a folder
  you choose. There is no account, no proprietary database, and no export
  step — the files on disk are your notes, byte-for-byte, and they sync to
  your other machines with whatever tool you already trust (Syncthing is the
  recommended pairing).

